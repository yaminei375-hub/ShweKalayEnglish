name: Build Shwe Kalay English APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack Android project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'ShweKalayEnglish_Android_Source*.zip' | head -n 1)"
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE"
          fi

          if [ -f "ShweKalayEnglish_Android/gradlew" ]; then
            echo "PROJECT_DIR=ShweKalayEnglish_Android" >> "$GITHUB_ENV"
          elif [ -f "gradlew" ] && { [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; }; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: Android project not found. Upload the project ZIP to the repository root."
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shwe-kalay-english-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
